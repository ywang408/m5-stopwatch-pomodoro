; M5Stack StopWatch 番茄钟固件
; 配置参照 M5Stack 官方文档（StopWatch 的 PlatformIO 配置）和 GOROman/vibewatch。
; 命令都在项目目录下用 uv 管理的环境执行，例如 `uv run pio run -t upload`。

[platformio]
default_envs = app

[env]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
; 打开串口时不要拉 DTR/RTS，避免把芯片复位
monitor_dtr = 0
monitor_rts = 0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    m5stack/M5Unified @ 0.2.23
    m5stack/M5GFX @ 0.2.30

; 番茄钟固件
[env:app]
build_src_filter = +<*> -<hwtest/> -<keycal/>

; 调试版：番茄时长 1 分钟按 1 秒走，并每秒在串口打印帧耗时
[env:debug]
extends = env:app
build_flags =
    ${env.build_flags}
    -DPOMO_DEBUG=1

; 阶段 0：硬件确认程序（src/hwtest/）
[env:hwtest]
build_src_filter = -<*> +<hwtest/>

; 校准程序：对准 L 界面“计入”“不计”标签的角度
[env:keycal]
build_src_filter = -<*> +<keycal/> +<power.cpp> +<log.cpp>
